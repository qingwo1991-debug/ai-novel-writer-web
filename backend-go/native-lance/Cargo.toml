[package]
name = "novel-lance"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "novel_lance"
crate-type = ["staticlib"]

[dependencies]
lancedb = { version = "=0.22.3", default-features = false }
arrow-array = "=56.2.0"
arrow-schema = "=56.2.0"
arrow-ipc = "=56.2.0"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
panic = "unwind"
debug = 0
