name: Go backend migration

on:
  push:
    branches: [main]
    paths:
      - 'backend-go/**'
      - 'Dockerfile.go'
      - 'web/operations.json'
      - 'electron/migrations/**'
      - 'electron/llm/**'
      - 'electron/platform/endpoint-fetch.ts'
      - 'electron/repositories/character-roster-schema.ts'
      - 'src/shared/**'
      - '.github/workflows/go-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend-go/**'
      - 'Dockerfile.go'
      - 'web/operations.json'
      - 'electron/migrations/**'
      - 'electron/llm/**'
      - 'electron/platform/endpoint-fetch.ts'
      - 'electron/repositories/character-roster-schema.ts'
      - 'src/shared/**'
      - '.github/workflows/go-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Parallel Go compile and static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Compile all production and test packages without executing tests
        run: |
          go mod download
          gofmt -w ./cmd ./internal
          git diff --binary -- . > /tmp/go-format.patch
          if ! out=$(go test -run '^$' ./... 2>&1); then
            printf '%s\n' "$out" | tail -60
            printf '::error title=compile failure::%s\n' "$(printf '%s' "$out" | grep -E '\.go:[0-9]+:' | head -4 | tr '\n' ' ')"
            exit 1
          fi
      - name: Static analysis independent of oracle generation
        run: go vet ./...
      - name: Upload formatting evidence even on compilation failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: go-compile-format-${{ github.sha }}
          path: /tmp/go-format.patch
          retention-days: 7
          if-no-files-found: ignore
  verify:
    name: Go format, vet, synthetic tests, race and binary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
          cache: true
      # The original TypeScript migration lane is a CI-only compatibility oracle.
      # Install only its SQLite driver, not the application/frontend dependency tree.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Generate synthetic SQLite contracts from the original migration lane
        env:
          NODE_PATH: ${{ runner.temp }}/novel-go-oracle/node_modules
        run: |
          export GO_AUTHORITY_CONTRACT="$RUNNER_TEMP/authority-contract.json"
          printf 'GO_AUTHORITY_CONTRACT=%s\n' "$GO_AUTHORITY_CONTRACT" >> "$GITHUB_ENV"
          command -v flock
          node ./contract/authority-contract.mjs
          export GO_KNOWLEDGECOPY_CONTRACT="$RUNNER_TEMP/knowledgecopy-contract.json"
          printf 'GO_KNOWLEDGECOPY_CONTRACT=%s\n' "$GO_KNOWLEDGECOPY_CONTRACT" >> "$GITHUB_ENV"
          node ./contract/knowledgecopy-contract.mjs
          test -s "$GO_KNOWLEDGECOPY_CONTRACT"
          export GO_KNOWLEDGEDOMAIN_CONTRACT="$RUNNER_TEMP/knowledge-domain-contract.json"
          printf 'GO_KNOWLEDGEDOMAIN_CONTRACT=%s\n' "$GO_KNOWLEDGEDOMAIN_CONTRACT" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/novel-go-oracle" --no-audit --no-fund --package-lock=false apache-arrow@18.1.0
          node ./contract/knowledge-domain-contract.mjs
          test -s "$GO_KNOWLEDGEDOMAIN_CONTRACT"
          export GO_KNOWLEDGEQUERY_CONTRACT="$RUNNER_TEMP/knowledge-query-contract.json"
          printf 'GO_KNOWLEDGEQUERY_CONTRACT=%s\n' "$GO_KNOWLEDGEQUERY_CONTRACT" >> "$GITHUB_ENV"
          node ./contract/knowledge-query-contract.mjs
          test -s "$GO_KNOWLEDGEQUERY_CONTRACT"
          test -s "$GO_AUTHORITY_CONTRACT"
          export GO_SQLITE_CONTRACT="$RUNNER_TEMP/novel-go-contract/contract.json"
          export GO_SECRET_CONTRACT="$RUNNER_TEMP/novel-go-secrets/contract.json"
          export GO_PROJECTCORE_CONTRACT="$RUNNER_TEMP/novel-go-projectcore/contract.json"
          export GO_REVIEWREVISION_CONTRACT="$RUNNER_TEMP/novel-go-reviewrevision/contract.json"
          export GO_POSTHISTORY_CONTRACT="$RUNNER_TEMP/novel-go-posthistory/contract.json"
          export GO_NARRATIVE_CONTRACT="$RUNNER_TEMP/novel-go-narrative/contract.json"
          export GO_BLUEPRINT_CONTRACT="$RUNNER_TEMP/novel-go-blueprint/contract.json"
          printf 'GO_BLUEPRINT_CONTRACT=%s\n' "$GO_BLUEPRINT_CONTRACT" >> "$GITHUB_ENV"
          export GO_PLOTTREE_CONTRACT="$RUNNER_TEMP/novel-go-plottree/contract.json"
          export GO_PLOTVALIDATION_CONTRACT="$RUNNER_TEMP/novel-go-plotvalidation/contract.json"
          printf 'GO_PLOTTREE_CONTRACT=%s\nGO_PLOTVALIDATION_CONTRACT=%s\n' "$GO_PLOTTREE_CONTRACT" "$GO_PLOTVALIDATION_CONTRACT" >> "$GITHUB_ENV"
          printf 'GO_NARRATIVE_CONTRACT=%s\n' "$GO_NARRATIVE_CONTRACT" >> "$GITHUB_ENV"
          printf 'GO_POSTHISTORY_CONTRACT=%s\n' "$GO_POSTHISTORY_CONTRACT" >> "$GITHUB_ENV"
          printf 'GO_REVIEWREVISION_CONTRACT=%s\n' "$GO_REVIEWREVISION_CONTRACT" >> "$GITHUB_ENV"
          printf 'GO_PROJECTCORE_CONTRACT=%s\n' "$GO_PROJECTCORE_CONTRACT" >> "$GITHUB_ENV"
          printf 'GO_SQLITE_CONTRACT=%s\nGO_SECRET_CONTRACT=%s\n' "$GO_SQLITE_CONTRACT" "$GO_SECRET_CONTRACT" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/novel-go-oracle" --no-audit --no-fund --package-lock=false better-sqlite3@13.0.3
          node --import ./contract/register-typescript.mjs ./contract/export-sqlite-contract.mjs
          node --import ./contract/register-typescript.mjs ./contract/secret-contract.mjs generate
          node ./contract/projectcore-contract.mjs
          node ./contract/reviewrevision-contract.mjs
          node ./contract/posthistory-contract.mjs
          node ./contract/narrative-contract.mjs
          node ./contract/blueprint-contract.mjs
          export GO_RECOVERY_CONTRACT="$RUNNER_TEMP/novel-go-recovery/contract.json"
          printf 'GO_RECOVERY_CONTRACT=%s\n' "$GO_RECOVERY_CONTRACT" >> "$GITHUB_ENV"
          node ./contract/recovery-contract.mjs
          test -s "$GO_RECOVERY_CONTRACT"
          export GO_SUMMARY_CONTRACT="$RUNNER_TEMP/novel-go-summary/contract.json"
          printf 'GO_SUMMARY_CONTRACT=%s\n' "$GO_SUMMARY_CONTRACT" >> "$GITHUB_ENV"
          node ./contract/summary-contract.mjs
          test -s "$GO_SUMMARY_CONTRACT"
          export GO_CHARACTERS_CONTRACT="$RUNNER_TEMP/novel-go-characters/contract.json"
          printf 'GO_CHARACTERS_CONTRACT=%s\n' "$GO_CHARACTERS_CONTRACT" >> "$GITHUB_ENV"
          node ./contract/characters-contract.mjs
          test -s "$GO_CHARACTERS_CONTRACT"
          export GO_GENERATION_LEDGER_CONTRACT="$RUNNER_TEMP/novel-go-generation-ledger/contract.json"
          printf 'GO_GENERATION_LEDGER_CONTRACT=%s\n' "$GO_GENERATION_LEDGER_CONTRACT" >> "$GITHUB_ENV"
          node ./contract/generation-ledger-contract.mjs
          test -s "$GO_GENERATION_LEDGER_CONTRACT"
          export GO_GENERATION_SERVICE_CONTRACT="$RUNNER_TEMP/novel-go-generation-service/contract.json"
          printf 'GO_GENERATION_SERVICE_CONTRACT=%s\n' "$GO_GENERATION_SERVICE_CONTRACT" >> "$GITHUB_ENV"
          node ./contract/generation-service-contract.mjs
          test -s "$GO_GENERATION_SERVICE_CONTRACT"
          test -s "$GO_BLUEPRINT_CONTRACT"
          node ./contract/plottree-contract.mjs
          node --import ./contract/register-typescript.mjs ./contract/plottree-validation-contract.mjs
          test -s "$GO_PLOTTREE_CONTRACT"
          test -s "$GO_PLOTVALIDATION_CONTRACT"
          test -s "$GO_NARRATIVE_CONTRACT"
          test -s "$GO_POSTHISTORY_CONTRACT"
          test -s "$GO_REVIEWREVISION_CONTRACT"
          test -s "$GO_PROJECTCORE_CONTRACT"
          test -s "$GO_SQLITE_CONTRACT"
          test -s "$GO_SECRET_CONTRACT"
      - name: Generate original global migration receipt fixtures
        run: |
          export GO_GLOBAL_MIGRATION_CONTRACT="$RUNNER_TEMP/novel-go-global-migration/contract.json"
          printf 'GO_GLOBAL_MIGRATION_CONTRACT=%s\n' "$GO_GLOBAL_MIGRATION_CONTRACT" >> "$GITHUB_ENV"
          node --import ./contract/register-typescript.mjs ./contract/global-migration-contract.mjs
          test -s "$GO_GLOBAL_MIGRATION_CONTRACT"
      - name: Upload original global migration receipt oracle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-global-migration-oracle-${{ github.sha }}
          path: ${{ runner.temp }}/novel-go-global-migration/contract.json
          retention-days: 7
          if-no-files-found: error
      - name: Generate original global PREPARED migration fixtures
        run: |
          export GO_GLOBAL_PREPARE_CONTRACT="$RUNNER_TEMP/novel-go-global-prepare/contract.json"
          printf 'GO_GLOBAL_PREPARE_CONTRACT=%s\n' "$GO_GLOBAL_PREPARE_CONTRACT" >> "$GITHUB_ENV"
          node --import ./contract/register-typescript.mjs ./contract/global-migration-prepare-contract.mjs
          test -s "$GO_GLOBAL_PREPARE_CONTRACT"
      - name: Upload original global PREPARED migration oracle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-global-prepare-oracle-${{ github.sha }}
          path: ${{ runner.temp }}/novel-go-global-prepare/contract.json
          retention-days: 7
          if-no-files-found: error
      - name: Generate original global VERIFIED migration fixtures
        run: |
          export GO_GLOBAL_VERIFIED_CONTRACT="$RUNNER_TEMP/novel-go-global-verified/contract.json"
          printf 'GO_GLOBAL_VERIFIED_CONTRACT=%s\n' "$GO_GLOBAL_VERIFIED_CONTRACT" >> "$GITHUB_ENV"
          node --import ./contract/register-typescript.mjs ./contract/global-migration-verified-contract.mjs
          test -s "$GO_GLOBAL_VERIFIED_CONTRACT"
      - name: Upload original global VERIFIED migration oracle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-global-verified-oracle-${{ github.sha }}
          path: ${{ runner.temp }}/novel-go-global-verified/contract.json
          retention-days: 7
          if-no-files-found: error
      - name: Generate original global INSTALLED and receipt migration fixtures
        run: |
          export GO_GLOBAL_INSTALL_CONTRACT="$RUNNER_TEMP/novel-go-global-install/contract.json"
          printf 'GO_GLOBAL_INSTALL_CONTRACT=%s\n' "$GO_GLOBAL_INSTALL_CONTRACT" >> "$GITHUB_ENV"
          node --import ./contract/register-typescript.mjs ./contract/global-migration-install-contract.mjs
          test -s "$GO_GLOBAL_INSTALL_CONTRACT"
      - name: Upload original global INSTALLED and receipt migration oracle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-global-install-oracle-${{ github.sha }}
          path: ${{ runner.temp }}/novel-go-global-install/contract.json
          retention-days: 7
          if-no-files-found: error
      - name: Generate original populated M03 not-generated review-cycle fixtures
        env:
          NODE_PATH: ${{ runner.temp }}/novel-go-oracle/node_modules
        run: |
          export GO_M03_NOTGENERATED_CONTRACT="$RUNNER_TEMP/novel-go-m03-notgenerated/contract.json"
          printf 'GO_M03_NOTGENERATED_CONTRACT=%s\n' "$GO_M03_NOTGENERATED_CONTRACT" >> "$GITHUB_ENV"
          node --import ./contract/register-typescript.mjs ./contract/m03-notgenerated-contract.mjs
          test -s "$GO_M03_NOTGENERATED_CONTRACT"
      - name: Upload original populated M03 review-cycle oracle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-m03-notgenerated-oracle-${{ github.sha }}
          path: ${{ runner.temp }}/novel-go-m03-notgenerated/contract.json
          retention-days: 7
          if-no-files-found: error
      - name: Generate original populated M03 generated and merge fixtures
        env:
          NODE_PATH: ${{ runner.temp }}/novel-go-oracle/node_modules
        run: |
          export GO_M03_GENERATED_CONTRACT="$RUNNER_TEMP/novel-go-m03-generated/contract.json"
          printf 'GO_M03_GENERATED_CONTRACT=%s\n' "$GO_M03_GENERATED_CONTRACT" >> "$GITHUB_ENV"
          node --import ./contract/register-typescript.mjs ./contract/m03-generated-contract.mjs
          test -s "$GO_M03_GENERATED_CONTRACT"
      - name: Upload original populated M03 generated and merge oracle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-m03-generated-oracle-${{ github.sha }}
          path: ${{ runner.temp }}/novel-go-m03-generated/contract.json
          retention-days: 7
          if-no-files-found: error
      - name: Generate original rechecked M03 verifier-only fixtures
        env:
          NODE_PATH: ${{ runner.temp }}/novel-go-oracle/node_modules
        run: |
          export GO_M03_GENERATED_CONTRACT="$RUNNER_TEMP/novel-go-m03-generated/contract.json"
          export GO_M03_RECHECKED_CONTRACT="$RUNNER_TEMP/novel-go-m03-rechecked/contract.json"
          printf 'GO_M03_RECHECKED_CONTRACT=%s\n' "$GO_M03_RECHECKED_CONTRACT" >> "$GITHUB_ENV"
          node --import ./contract/register-typescript.mjs ./contract/m03-rechecked-contract.mjs
          test -s "$GO_M03_RECHECKED_CONTRACT"
      - name: Upload original rechecked M03 verifier-only oracle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-m03-rechecked-oracle-${{ github.sha }}
          path: ${{ runner.temp }}/novel-go-m03-rechecked/contract.json
          retention-days: 7
          if-no-files-found: error
      - name: Generate original recognized v4 populated M03 fixtures
        env:
          NODE_PATH: ${{ runner.temp }}/novel-go-oracle/node_modules
        run: |
          export GO_M03_FULL_V4_CONTRACT="$RUNNER_TEMP/novel-go-m03-full-v4/contract.json"
          printf 'GO_M03_FULL_V4_CONTRACT=%s\n' "$GO_M03_FULL_V4_CONTRACT" >> "$GITHUB_ENV"
          node --import ./contract/register-typescript.mjs ./contract/m03-full-v4-contract.mjs
          test -s "$GO_M03_FULL_V4_CONTRACT"
      - name: Upload original recognized v4 populated M03 oracle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-m03-full-v4-oracle-${{ github.sha }}
          path: ${{ runner.temp }}/novel-go-m03-full-v4/contract.json
          retention-days: 7
          if-no-files-found: error
      - name: Generate original recognized v7 populated M03 fixtures
        env:
          NODE_PATH: ${{ runner.temp }}/novel-go-oracle/node_modules
        run: |
          export GO_M03_FULL_V7_CONTRACT="$RUNNER_TEMP/novel-go-m03-full-v7/contract.json"
          printf 'GO_M03_FULL_V7_CONTRACT=%s\n' "$GO_M03_FULL_V7_CONTRACT" >> "$GITHUB_ENV"
          node --import ./contract/register-typescript.mjs ./contract/m03-full-v7-contract.mjs
          test -s "$GO_M03_FULL_V7_CONTRACT"
      - name: Upload original recognized v7 populated M03 oracle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-m03-full-v7-oracle-${{ github.sha }}
          path: ${{ runner.temp }}/novel-go-m03-full-v7/contract.json
          retention-days: 7
          if-no-files-found: error
      - name: Generate original review-report parser fixtures
        run: |
          export GO_REVIEW_REPORT_PARSER_CONTRACT="$RUNNER_TEMP/novel-go-review-report-parser/contract.json"
          printf 'GO_REVIEW_REPORT_PARSER_CONTRACT=%s\n' "$GO_REVIEW_REPORT_PARSER_CONTRACT" >> "$GITHUB_ENV"
          node --import ./contract/register-typescript.mjs ./contract/review-report-parser-contract.mjs
          test -s "$GO_REVIEW_REPORT_PARSER_CONTRACT"
      - name: Generate original chapter-goal review fixtures
        run: |
          export GO_REVIEW_GOALS_CONTRACT="$RUNNER_TEMP/novel-go-review-goals/contract.json"
          printf 'GO_REVIEW_GOALS_CONTRACT=%s\n' "$GO_REVIEW_GOALS_CONTRACT" >> "$GITHUB_ENV"
          node --import ./contract/register-typescript.mjs ./contract/review-goals-contract.mjs
          test -s "$GO_REVIEW_GOALS_CONTRACT"
      - name: Generate original consistency-merge review fixtures
        run: |
          export GO_REVIEW_CONSISTENCY_MERGE_CONTRACT="$RUNNER_TEMP/novel-go-review-consistency-merge/contract.json"
          printf 'GO_REVIEW_CONSISTENCY_MERGE_CONTRACT=%s\n' "$GO_REVIEW_CONSISTENCY_MERGE_CONTRACT" >> "$GITHUB_ENV"
          node --import ./contract/register-typescript.mjs ./contract/review-consistency-merge-contract.mjs
          test -s "$GO_REVIEW_CONSISTENCY_MERGE_CONTRACT"
      - name: Generate original complete review-report fixtures
        run: |
          export GO_REVIEW_BUILDER_CONTRACT="$RUNNER_TEMP/novel-go-review-builder/contract.json"
          printf 'GO_REVIEW_BUILDER_CONTRACT=%s\n' "$GO_REVIEW_BUILDER_CONTRACT" >> "$GITHUB_ENV"
          node --import ./contract/register-typescript.mjs ./contract/review-builder-contract.mjs
          test -s "$GO_REVIEW_BUILDER_CONTRACT"
      - name: Generate original review-recheck report fixtures
        run: |
          export GO_REVIEW_RECHECK_CONTRACT="$RUNNER_TEMP/novel-go-review-recheck/contract.json"
          printf 'GO_REVIEW_RECHECK_CONTRACT=%s\n' "$GO_REVIEW_RECHECK_CONTRACT" >> "$GITHUB_ENV"
          node --import ./contract/register-typescript.mjs ./contract/review-recheck-contract.mjs
          test -s "$GO_REVIEW_RECHECK_CONTRACT"
      - name: Upload original review-report component oracles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-review-report-components-${{ github.sha }}
          path: |
            ${{ runner.temp }}/novel-go-review-report-parser/contract.json
            ${{ runner.temp }}/novel-go-review-goals/contract.json
            ${{ runner.temp }}/novel-go-review-consistency-merge/contract.json
            ${{ runner.temp }}/novel-go-review-builder/contract.json
            ${{ runner.temp }}/novel-go-review-recheck/contract.json
          retention-days: 7
          if-no-files-found: error
      - name: Extract original recognized schemas for later pinning
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync, writeFileSync } from "node:fs";
            import { join } from "node:path";
            const source = JSON.parse(readFileSync(process.env.GO_SQLITE_CONTRACT, "utf8"));
            assert.equal(source.formatVersion, 1);
            assert.equal(source.currentVersion, 7);
            assert(Array.isArray(source.recognized) && source.recognized.length > 0);
            for (const entry of source.recognized) {
              assert(Number.isInteger(entry.version) && entry.version >= 0 && entry.version <= 7);
              assert.match(entry.fingerprint, /^[0-9a-f]{64}$/u);
            }
            const recognized = {
              formatVersion: source.formatVersion,
              currentVersion: source.currentVersion,
              recognized: source.recognized,
            };
            writeFileSync(join(process.env.RUNNER_TEMP, "novel-go-contract", "recognized-only.json"),
              JSON.stringify(recognized, null, 2) + "\n", { flag: "wx", mode: 0o600 });
          '
      # baseline-v7.db is exported here, by the lane whose schema the Go code
      # must match, and is the only project database the container journey ever
      # starts from. Uploading it keeps the journey from re-declaring any DDL.
      - name: Upload original recognized schemas and v7 baseline database
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-recognized-contract-${{ github.sha }}
          path: |
            ${{ runner.temp }}/novel-go-contract/recognized-only.json
            ${{ runner.temp }}/novel-go-contract/baseline-v7.db
          retention-days: 7
          if-no-files-found: error
      - name: Match original TypeScript schemas to pinned Go contract
        run: cmp -- ./internal/admission/recognized-schemas-v7.json "$RUNNER_TEMP/novel-go-contract/recognized-only.json"
      - name: Generate original visible and OpenAI synthetic protocol contracts
        run: |
          export GO_VISIBLE_CONTRACT="$RUNNER_TEMP/novel-go-visible/visible-contract.json"
          export GO_OPENAI_CONTRACT="$RUNNER_TEMP/novel-go-openai/contract.json"
          export GO_GEMINI_CONTRACT="$RUNNER_TEMP/novel-go-gemini/contract.json"
          printf 'GO_GEMINI_CONTRACT=%s\n' "$GO_GEMINI_CONTRACT" >> "$GITHUB_ENV"
          printf 'GO_VISIBLE_CONTRACT=%s\nGO_OPENAI_CONTRACT=%s\n' "$GO_VISIBLE_CONTRACT" "$GO_OPENAI_CONTRACT" >> "$GITHUB_ENV"
          node --import ./contract/register-typescript.mjs ./contract/visible-contract.mjs
          node ./contract/openai-contract.mjs
          node ./contract/gemini-contract.mjs
          test -s "$GO_GEMINI_CONTRACT"
          test -s "$GO_VISIBLE_CONTRACT"
          test -s "$GO_OPENAI_CONTRACT"
          export GO_EMBEDDING_CONTRACT="$RUNNER_TEMP/embedding-contract.json"
          printf 'GO_EMBEDDING_CONTRACT=%s\n' "$GO_EMBEDDING_CONTRACT" >> "$GITHUB_ENV"
          node ./contract/embedding-contract.mjs
          test -s "$GO_EMBEDDING_CONTRACT"
      - name: Generate remaining-domain original synthetic contracts
        id: remaining-contracts
        continue-on-error: true
        env:
          NODE_PATH: ${{ runner.temp }}/novel-go-oracle/node_modules
        run: |
          npm install --prefix "$RUNNER_TEMP/novel-go-oracle" --no-audit --no-fund --package-lock=false esbuild@0.28.1 yauzl@2.10.0
          export GO_GLOBAL_CONFIG_CONTRACT="$RUNNER_TEMP/novel-go-global-config/contract.json"
          export GO_PROMPT_SKILLS_CONTRACT="$RUNNER_TEMP/novel-go-prompt-skills/contract.json"
          export GO_MCP_CONTRACT="$RUNNER_TEMP/novel-go-mcp/contract.json"
          export GO_ARCHIVE_FORMAT_CONTRACT="$RUNNER_TEMP/novel-go-archive-format/contract.json"
          export GO_GENERATION_OWNER_CONTRACT="$RUNNER_TEMP/novel-go-generation-owner/contract.json"
          export GO_IMPORT_SOURCE_CONTRACT="$RUNNER_TEMP/novel-go-import-source/contract.json"
          export GO_WEBDAV_CONTRACT="$RUNNER_TEMP/novel-go-webdav/contract.json"
          export GO_FINALIZATION_OUTBOX_CONTRACT="$RUNNER_TEMP/novel-go-finalization-outbox/contract.json"
          export GO_KNOWLEDGE_LOGICAL_CONTRACT="$RUNNER_TEMP/novel-go-knowledge-logical/contract.json"
          export GO_PUBLIC_RESPONSE_CONTRACT="$RUNNER_TEMP/novel-go-public-response/contract.json"
          for name in GO_GLOBAL_CONFIG_CONTRACT GO_PROMPT_SKILLS_CONTRACT GO_MCP_CONTRACT GO_ARCHIVE_FORMAT_CONTRACT GO_GENERATION_OWNER_CONTRACT GO_IMPORT_SOURCE_CONTRACT GO_WEBDAV_CONTRACT GO_FINALIZATION_OUTBOX_CONTRACT GO_KNOWLEDGE_LOGICAL_CONTRACT GO_PUBLIC_RESPONSE_CONTRACT; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
          failures=0
          run_contract() {
            if "$@"; then
              printf 'PASS %s\n' "$*" >> "$GITHUB_STEP_SUMMARY"
            else
              printf 'FAIL %s\n' "$*" >> "$GITHUB_STEP_SUMMARY"
              failures=$((failures + 1))
            fi
          }
          run_contract node ./contract/global-config-contract.mjs
          run_contract node ./contract/prompt-skills-contract.mjs
          run_contract node ./contract/mcp-contract.mjs generate
          run_contract node ./contract/archive-format-contract.mjs
          run_contract node ./contract/generation-owner-contract.mjs generate
          run_contract node ./contract/import-source-contract.mjs
          run_contract node ./contract/webdav-contract.mjs generate
          run_contract node ./contract/finalization-outbox-contract.mjs
          run_contract node --experimental-vm-modules ./contract/knowledge-logical-contract.mjs
          run_contract node ./contract/public-response-contract.mjs
          test "$failures" -eq 0
          for name in GO_GLOBAL_CONFIG_CONTRACT GO_PROMPT_SKILLS_CONTRACT GO_MCP_CONTRACT GO_ARCHIVE_FORMAT_CONTRACT GO_GENERATION_OWNER_CONTRACT GO_IMPORT_SOURCE_CONTRACT GO_WEBDAV_CONTRACT GO_FINALIZATION_OUTBOX_CONTRACT GO_KNOWLEDGE_LOGICAL_CONTRACT GO_PUBLIC_RESPONSE_CONTRACT; do
            test -s "${!name}"
          done
      - name: Verify pinned modules
        run: |
          go mod download
          go mod verify
      # Formatting is also performed remotely; no local compilation/test needed.
      # The checked artifact below is built from the formatted temporary checkout.
      - name: Format Go sources on the runner
        run: |
          gofmt -w ./cmd ./internal
          git diff --binary -- . > /tmp/go-format.patch
          if test -s /tmp/go-format.patch; then
            printf 'Go source formatting patch is available as an artifact.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Static analysis
        if: ${{ !cancelled() }}
        run: go vet ./...
      - name: Synthetic-data unit and HTTP contract tests
        id: unit-tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -o pipefail
          status=0
          go test -count=1 -timeout=4m -json ./... | tee /tmp/go-tests.jsonl || status=$?
          if test "$status" -ne 0; then
            printf '::error title=go test failures::%s\n' "$(grep '"Action":"fail"' /tmp/go-tests.jsonl | grep -o '"Package":"[^"]*","Test":"[^"]*"' | tr '\n' ' ' | cut -c1-600)"
            grep '"Action":"fail"' /tmp/go-tests.jsonl | grep -o '"Package":"[^"]*"' | sed 's/.*\///' | sort -u | while read -r pkg; do
              printf '::error title=failed package::%s\n' "$pkg"
            done
            firstpkg=$(grep '"Action":"fail"' /tmp/go-tests.jsonl | head -1 | grep -o '"Package":"[^"]*"' | cut -d'"' -f4)
            printf '::error title=assertion text::%s\n' "$(grep '"Action":"output"' /tmp/go-tests.jsonl | grep "\"Package\":\"$firstpkg\"" | grep -o '_test\.go:[0-9]*:[^"]*' | head -3 | tr '\n' ' ' | cut -c1-700)"
          fi
          exit "$status"
      - name: Race detector (synthetic temporary databases only)
        id: race-tests
        if: ${{ !cancelled() && steps.unit-tests.outcome == 'success' && steps.remaining-contracts.outcome == 'success' }}
        continue-on-error: true
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 -timeout=5m ./...
      - name: Enforce collected contract and test failures
        if: ${{ !cancelled() }}
        run: |
          printf '::error title=step outcomes::contracts=%s unit=%s race=%s\n' '${{ steps.remaining-contracts.outcome }}' '${{ steps.unit-tests.outcome }}' '${{ steps.race-tests.outcome }}'
          test '${{ steps.remaining-contracts.outcome }}' = success
          test '${{ steps.unit-tests.outcome }}' = success
          test '${{ steps.race-tests.outcome }}' = success
      - name: Original TypeScript decrypts Go-generated credential envelopes
        run: node --import ./contract/register-typescript.mjs ./contract/secret-contract.mjs verify
      - name: Build Go-only migration binary
        run: |
          mkdir -p out
          CGO_ENABLED=1 go build -trimpath -buildvcs=true -o out/novel-server ./cmd/novel-server
          # CI-only fixture generator for the container journey below. It ships
          # as a job artifact and never inside the image.
          CGO_ENABLED=1 go build -trimpath -buildvcs=true -o out/production-fixture ./cmd/production-fixture
          sha256sum out/novel-server out/production-fixture > out/SHA256SUMS
      - name: Original TypeScript reopens Go-written disposable global generation
        timeout-minutes: 3
        run: node --import ./contract/register-typescript.mjs ./contract/global-go-node-rollback.mjs
      - name: Smoke binary without author data or Node
        shell: bash
        run: |
          set -euo pipefail
          PATH=/nonexistent ./out/novel-server -listen 127.0.0.1:16082 > /tmp/go-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:16082/healthz > /tmp/go-health.json; then break; fi
            kill -0 "$pid"
            sleep 1
          done
          python3 - <<'PY'
          import json
          with open('/tmp/go-health.json') as file:
              health = json.load(file)
          assert health['runtime'] == 'go'
          assert health['electron'] is False
          assert health['migrationComplete'] is False
          PY
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:16082/api/bootstrap)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'X-Novel-User: synthetic-ci' http://127.0.0.1:16082/api/bootstrap)" = 200
          if NOVEL_DATA_ROOT=/tmp/not-author-data ./out/novel-server; then exit 1; fi
          if ./out/novel-server -listen 0.0.0.0:16082; then exit 1; fi
          # No legacy application worker/FFI bridge is allowed. The ONLY exec
          # site is the separately disabled-by-default, trusted-admin MCP stdio
          # tool transport, not an implementation of the application in Node.
          python3 - <<'PY'
          from pathlib import Path
          import re
          exec_sites = []
          for root in ('cmd', 'internal'):
              for source in Path(root).rglob('*.go'):
                  if source.name.endswith('_test.go'):
                      continue
                  text = source.read_text()
                  assert not re.search(r'(?<![A-Za-z0-9_])node:|worker\.mjs|dist-server', text), source
                  if '"os/exec"' in text:
                      exec_sites.append(source.as_posix())
                      assert source.as_posix() == 'internal/mcp/transports.go', source
                      assert 'exec.Command(c.config.Command,c.config.Args...)' in text.replace(' ', '').replace('\t', '') or re.search(r'exec\.Command\(c\.config\.Command,\s*c\.config\.Args\.\.\.\)', text), source
          assert exec_sites == ['internal/mcp/transports.go'], exec_sites
          PY
      - name: Upload compiler/test evidence and formatting patch
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-migration-evidence-${{ github.sha }}
          path: |
            /tmp/go-format.patch
            /tmp/go-tests.jsonl
            /tmp/go-smoke.log
            /tmp/go-health.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload non-production Go binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: novel-go-migration-linux-amd64-${{ github.sha }}
          path: backend-go/out/
          retention-days: 7
      - name: State migration and deployment limits
        run: |
          printf '### Go migration foundation\n\nGo tests, race detector, compiler and smoke ran on GitHub, not on the deployment host.\n\nThis binary is **not feature complete**: unported operations return 501. No image push or production deployment was performed.\n' >> "$GITHUB_STEP_SUMMARY"
  image:
    name: Unpublished Go container with disposable smoke and production journey
    needs: [compile, verify]
    runs-on: ubuntu-24.04
    # The image now builds the browser app (frozen pnpm install + Vite) before
    # copying the prebuilt Go binary, so the previous 15 minute budget is too tight.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: novel-go-migration-linux-amd64-${{ github.sha }}
          path: backend-go/out
      - name: Confirm binary checksum from the passing Go job
        run: |
          cd backend-go
          sha256sum -c out/SHA256SUMS
          chmod +x out/novel-server out/production-fixture
      - name: Build local candidate image on GitHub runner
        run: docker build --pull --file Dockerfile.go --tag novel-go:migration-ci .
      - name: Smoke image without author data or Node
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name novel-go-migration-ci --network host --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
            novel-go:migration-ci
          trap 'docker rm -f novel-go-migration-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:16082/healthz > /tmp/go-image-health.json; then break; fi
            test "$(docker inspect --format '{{.State.Running}}' novel-go-migration-ci)" = true
            sleep 1
          done
          python3 - <<'PY'
          import json
          with open('/tmp/go-image-health.json') as file:
              health = json.load(file)
          assert health['runtime'] == 'go'
          assert health['migrationComplete'] is False
          PY
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:16082/api/bootstrap)" = 401
          # The image must serve the browser app, not only the API. Static files
          # stay behind the trusted proxy header, exactly like /api/*.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:16082/)" = 401
          curl --silent --fail --dump-header /tmp/go-image-index.headers \
            --output /tmp/go-image-index.html \
            --header 'X-Novel-User: synthetic-ci' http://127.0.0.1:16082/
          grep -qi '^content-type: text/html; charset=utf-8' /tmp/go-image-index.headers
          grep -q 'id="root"' /tmp/go-image-index.html
          # A deep client route falls back to the same app shell.
          curl --silent --fail --output /tmp/go-image-deep.html \
            --header 'X-Novel-User: synthetic-ci' http://127.0.0.1:16082/projects/ci/deep/client/route
          cmp -s /tmp/go-image-index.html /tmp/go-image-deep.html
          # A content-addressed build asset is served with its real type.
          asset=$(awk 'match($0, /\/assets\/[^"]*\.js/) { print substr($0, RSTART, RLENGTH); exit }' /tmp/go-image-index.html)
          test -n "$asset"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'X-Novel-User: synthetic-ci' "http://127.0.0.1:16082$asset")" = 200
          test "$(curl --silent --output /dev/null --write-out '%{content_type}' --header 'X-Novel-User: synthetic-ci' "http://127.0.0.1:16082$asset")" = 'text/javascript; charset=utf-8'
          docker exec novel-go-migration-ci sh -c '! command -v node && ! command -v npm && ! command -v electron'
          printf 'Go migration container passed isolated smoke. It was not published or deployed.\n' >> "$GITHUB_STEP_SUMMARY"
      # The journey below is the reason this job exists: the same published-shape
      # image, started with a real (synthetic) NOVEL_DATA_ROOT mounted, replays
      # the browser's own bootstrap + open + list + save + read sequence over
      # HTTP. It starts from the v7 database the TypeScript lane exported, so no
      # schema is re-declared here; the fixture helper re-proves it against the
      # pinned Go contract before the container starts.
      - name: Download the original recognized schemas and v7 baseline database
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: go-recognized-contract-${{ github.sha }}
          path: ${{ runner.temp }}/novel-go-contract
      - name: Build a disposable production data root
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/novel-go-production-journey"
          baseline="$RUNNER_TEMP/novel-go-contract/baseline-v7.db"
          project_id=5f4c9a12-7d3e-4b81-9c26-8a1e0d3b7f42
          seed='第一章原稿：他推开门，风从走廊尽头涌进来。'
          test -s "$baseline"
          test ! -e "$root"
          # The journey step reads these two values instead of repeating them,
          # so the body it saves against cannot drift from the body seeded here.
          printf '%s\n' "$project_id" > "$RUNNER_TEMP/novel-go-journey-project.txt"
          printf '%s' "$seed" > "$RUNNER_TEMP/novel-go-journey-seed.txt"
          backend-go/out/production-fixture \
            -root "$root" \
            -baseline "$baseline" \
            -workspace ci-novel \
            -project-id "$project_id" \
            -generation 9b7e2c41-3a5d-4e18-8f60-6c2d9b4a1e73 \
            -seed "$seed"
          # The image runs as uid 65532 (Dockerfile.go USER), exactly like a
          # deployment, so the mounted root must be owned by that identity and
          # must not be group/world writable: the migration receipt, the writer
          # lock and every author database are re-checked against the runtime's
          # own effective uid.
          sudo chown -R 65532:65532 "$root"
          sudo chmod -R go-rwx "$root"
          sudo find "$root" -maxdepth 4 -printf '%m %u %g %p\n' | sort
      - name: Prove the production draft journey inside the real image
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/novel-go-production-journey"
          work="$RUNNER_TEMP/novel-go-journey-evidence"
          rm -rf "$work"
          mkdir -p "$work"
          base=http://127.0.0.1:16086
          project_path=/data/workspaces/ci-novel
          project_id=$(cat "$RUNNER_TEMP/novel-go-journey-project.txt")
          author=synthetic-ci-author
          client=client_0123456789abcdef0123456789abcdef
          seed=$(cat "$RUNNER_TEMP/novel-go-journey-seed.txt")
          saved='第一章改稿：她推开门，雨从走廊尽头涌了进来。'
          words=22

          call() {
            local operation=$1
            local body=$2
            local output=$3
            local code
            code=$(curl --silent --show-error --output "$output" --write-out '%{http_code}' \
              --request POST "$base/api/operations/$operation" \
              --header "X-Novel-User: $author" \
              --header "X-Client-Id: $client" \
              --header "X-CSRF-Token: $csrf" \
              --header "Origin: $base" \
              --header 'Content-Type: application/json' \
              --cookie "$session" \
              --data-binary "$body")
            printf '%s -> %s\n' "$operation" "$code" | tee -a "$work/statuses.txt"
            if test "$code" != 200; then
              printf '::error title=%s returned %s::%s\n' "$operation" "$code" "$(head -c 600 "$output")"
              exit 1
            fi
          }
          assert_json() {
            local file=$1
            local filter=$2
            shift 2
            if ! jq -e "$@" "$filter" "$file" > /dev/null; then
              printf '::error title=unexpected response from %s::%s\n' "$(basename "$file")" "$(head -c 600 "$file")"
              exit 1
            fi
          }

          # The image is started the way a deployment starts it: no Node, no
          # writable root filesystem, the data root as the only writable mount.
          # --network host is required for the same reason as the smoke step
          # above: the entrypoint binds a loopback address.
          docker run -d --name novel-go-journey-ci --network host --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
            --mount "type=bind,source=$root,target=/data" \
            --env NOVEL_DATA_ROOT=/data \
            novel-go:migration-ci -listen 127.0.0.1:16086
          trap 'code=$?; if test "$code" -ne 0; then docker logs --tail 80 novel-go-journey-ci 2>&1 || true; fi; docker rm -f novel-go-journey-ci >/dev/null 2>&1 || true' EXIT
          healthy=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail "$base/healthz" > "$work/health.json"; then healthy=1; break; fi
            if test "$(docker inspect --format '{{.State.Running}}' novel-go-journey-ci)" != true; then
              docker logs novel-go-journey-ci 2>&1 || true
              printf '::error title=container exited::the production lane refused the disposable data root\n'
              exit 1
            fi
            sleep 1
          done
          test "$healthy" = 1
          assert_json "$work/health.json" '.ok == true and .runtime == "go" and .electron == false'

          code=$(curl --silent --show-error --output "$work/bootstrap.json" --dump-header "$work/bootstrap.headers" \
            --write-out '%{http_code}' \
            --header "X-Novel-User: $author" \
            --header "X-Client-Id: $client" \
            "$base/api/bootstrap")
          printf 'bootstrap -> %s\n' "$code" | tee -a "$work/statuses.txt"
          test "$code" = 200
          # A synthetic-lane generation would mean the production data root was
          # never admitted, so the journey below would prove nothing.
          assert_json "$work/bootstrap.json" '.generation == "go-production-admitted" and (.csrfToken | length) > 0'
          csrf=$(jq -er '.csrfToken' "$work/bootstrap.json")
          session=$(grep -i '^set-cookie:' "$work/bootstrap.headers" | sed -e 's/^[^:]*:[[:space:]]*//' -e 's/;.*//' | tr -d '\r' | head -1 || true)
          case "$session" in
            novel_session=*) ;;
            *) printf '::error title=no session cookie::%s\n' "$session"; exit 1 ;;
          esac

          call project:open \
            "$(jq -nc --arg path "$project_path" '{args: [$path, "open-token-ci", $path]}')" \
            "$work/open.json"
          assert_json "$work/open.json" '
            .result.success == true
            and (.result.error // "") == ""
            and .result.dbReady == true
            and .result.requestToken == "open-token-ci"
            and .result.project.id == $id
            and .result.project.path == $path
            and (.result.project.sessionLease | length) > 0
          ' --arg id "$project_id" --arg path "$project_path"
          lease=$(jq -er '.result.project.sessionLease' "$work/open.json")

          call db:draft-list \
            "$(jq -nc --arg path "$project_path" --arg id "$project_id" --arg lease "$lease" \
              '{args: [1, $path, {projectId: $id, leaseId: $lease, projectPath: $path}]}')" \
            "$work/draft-list.json"
          assert_json "$work/draft-list.json" '
            (.result | type) == "array"
            and ([.result[] | select(.id == 1 and .chapterNumber == 1 and .version == 1 and .status == "draft")] | length) == 1
            and (.result[0] | has("content") | not)
          '

          call db:draft-update-content \
            "$(jq -nc --arg path "$project_path" --arg id "$project_id" --arg lease "$lease" \
              --arg body "$saved" --arg baseline "$seed" --argjson words "$words" \
              '{args: [1, $body, $words, $path, $baseline, {projectId: $id, leaseId: $lease, projectPath: $path}]}')" \
            "$work/save.json"
          assert_json "$work/save.json" '
            .result.success == true
            and (.result.errorCode // "") == ""
            and .result.projectSession.projectId == $id
            and .result.projectSession.projectPath == $path
            and (.result.projectSession.leaseId | length) > 0
          ' --arg id "$project_id" --arg path "$project_path"
          fresh=$(jq -er '.result.projectSession.leaseId' "$work/save.json")
          test "$fresh" != "$lease"

          call db:draft-get-full \
            "$(jq -nc --arg path "$project_path" --arg id "$project_id" --arg lease "$fresh" \
              '{args: [1, $path, {projectId: $id, leaseId: $lease, projectPath: $path}]}')" \
            "$work/draft-get-full.json"
          assert_json "$work/draft-get-full.json" '
            .result.id == 1
            and .result.chapterNumber == 1
            and .result.status == "draft"
            and .result.content == $body
            and .result.wordCount == $words
          ' --arg body "$saved" --argjson words "$words"
          readback=$(jq -er '.result.content' "$work/draft-get-full.json")
          test "$readback" = "$saved"

          # The editor's read surface, bound in the same lane: every call below is
          # answered from the mounted author database under the live lease, and
          # each assertion checks the seeded row instead of merely a 200. A stale
          # lease is refused for the same operations at the end of this block.
          expect_refusal() {
            local operation=$1
            local body=$2
            local output=$3
            local code
            code=$(curl --silent --show-error --output "$output" --write-out '%{http_code}' \
              --request POST "$base/api/operations/$operation" \
              --header "X-Novel-User: $author" \
              --header "X-Client-Id: $client" \
              --header "X-CSRF-Token: $csrf" \
              --header "Origin: $base" \
              --header 'Content-Type: application/json' \
              --cookie "$session" \
              --data-binary "$body")
            printf '%s -> %s (refused)\n' "$operation" "$code" | tee -a "$work/refusals.txt"
            if test "$code" = 200; then
              printf '::error title=%s answered 200 under a stale lease::%s\n' "$operation" "$(head -c 600 "$output")"
              exit 1
            fi
            if ! jq -e '(.error.code | length) > 0' "$output" > /dev/null; then
              printf '::error title=%s refused without a stable code::%s\n' "$operation" "$(head -c 600 "$output")"
              exit 1
            fi
          }
          editor_ctx=$(jq -nc --arg path "$project_path" --arg id "$project_id" --arg lease "$fresh" \
            '{projectId: $id, leaseId: $lease, projectPath: $path}')
          novel='CI Journey Novel'
          card='甲'
          chapter='第一章 门'

          call db:character-get-all \
            "$(jq -nc --arg path "$project_path" --argjson ctx "$editor_ctx" '{args: [$path, $ctx]}')" \
            "$work/character-get-all.json"
          assert_json "$work/character-get-all.json" '
            (.result | type) == "array"
            and (.result | length) == 1
            and .result[0].name == $name
            and .result[0].characterId == "ci-character-1"
            and .result[0].role == "protagonist"
          ' --arg name "$card"

          call db:character-roster-read \
            "$(jq -nc --arg path "$project_path" --argjson ctx "$editor_ctx" '{args: [$path, $ctx]}')" \
            "$work/character-roster-read.json"
          assert_json "$work/character-roster-read.json" '
            (.result.entries | length) == 1
            and .result.entries[0].name == $name
            and (.result | has("identityRevision"))
          ' --arg name "$card"

          call character-identity:read \
            "$(jq -nc --argjson ctx "$editor_ctx" '{args: [$ctx]}')" \
            "$work/character-identity.json"
          assert_json "$work/character-identity.json" '
            (.result.characters | length) == 1
            and .result.characters[0].fields.name == $name
            and (.result | has("revision"))
          ' --arg name "$card"

          call db:project-core-get \
            "$(jq -nc --arg path "$project_path" --argjson ctx "$editor_ctx" '{args: [$path, $ctx]}')" \
            "$work/project-core-get.json"
          assert_json "$work/project-core-get.json" '
            .result.projectName == $novel
            and .result.totalChapters == 12
            and .result.wordsPerChapter == 3000
          ' --arg novel "$novel"

          call db:blueprint-get-all \
            "$(jq -nc --arg path "$project_path" --argjson ctx "$editor_ctx" '{args: [$path, $ctx]}')" \
            "$work/blueprint-get-all.json"
          assert_json "$work/blueprint-get-all.json" '
            (.result | type) == "array"
            and (.result | length) == 1
            and .result[0].chapterNumber == 1
            and .result[0].title == $title
          ' --arg title "$chapter"

          call db:blueprint-get \
            "$(jq -nc --arg path "$project_path" --argjson ctx "$editor_ctx" '{args: [1, $path, $ctx]}')" \
            "$work/blueprint-get.json"
          assert_json "$work/blueprint-get.json" '
            .result.chapterNumber == 1
            and .result.title == $title
            and .result.role == "setup"
          ' --arg title "$chapter"

          # Built from the same rows the journey just saved, so the aggregate is
          # compared against the saved body and word count, not a fixture guess.
          call project:overview-current \
            "$(jq -nc --argjson ctx "$editor_ctx" '{args: [$ctx]}')" \
            "$work/overview.json"
          assert_json "$work/overview.json" '
            .result.state == "ready"
            and .result.name == $novel
            and .result.characters == 1
            and .result.plannedChapters == 12
            and (.result.stages | length) == 6
            and .result.totalWords == $words
            and .result.excerpt == $saved
          ' --arg novel "$novel" --argjson words "$words" --arg saved "$saved"

          # The same fence still refuses a lease this server never issued.
          stale_ctx=$(jq -nc --arg path "$project_path" --arg id "$project_id" \
            '{projectId: $id, leaseId: "stale-lease-ci", projectPath: $path}')
          expect_refusal db:character-get-all \
            "$(jq -nc --arg path "$project_path" --argjson ctx "$stale_ctx" '{args: [$path, $ctx]}')" \
            "$work/stale-character-get-all.json"
          expect_refusal project:overview-current \
            "$(jq -nc --argjson ctx "$stale_ctx" '{args: [$ctx]}')" \
            "$work/stale-overview.json"
          printf 'editor reads: character=%s core=%s blueprint=%s; stale lease refused: characters=%s overview=%s\n' \
            "$card" "$novel" "$chapter" \
            "$(jq -r '.error.code' "$work/stale-character-get-all.json")" \
            "$(jq -r '.error.code' "$work/stale-overview.json")" \
            | tee -a "$work/statuses.txt"

          # The generation family's committed-state half plus the model
          # configuration reads. generation:list/generation:read project the
          # ledger rows the fixture committed through the shipped store, and the
          # four llm reads project the committed generation's config.json and
          # models.json. The epoch below is the fixture's frozen historical lease,
          # which this session never held: the read must serve history and report
          # it non-replayable instead of refusing a stale epoch. Every value here
          # mirrors a fixture constant, so a drift fails instead of proving nothing.
          generation_epoch=lease-0000000001-history
          generation_operation=chapter-draft
          generation_text='草稿候选：门后有人。'
          model_id=ci-model-1
          embedding_model_id=ci-embedding-model-1

          call generation:list \
            "$(jq -nc --argjson ctx "$editor_ctx" '{args: [$ctx]}')" \
            "$work/generation-list.json"
          assert_json "$work/generation-list.json" '
            (.result | type) == "array"
            and (.result | length) == 1
            and .result[0].status == "running"
            and .result[0].operation == $operation
            and .result[0].handle.projectId == $id
            and .result[0].handle.epoch == $epoch
            and (.result[0].handle.runId | length) > 0
            and (.result[0].handle.rootActionId | length) > 0
          ' --arg id "$project_id" --arg epoch "$generation_epoch" --arg operation "$generation_operation"
          run_handle=$(jq -c '.result[0].handle' "$work/generation-list.json")

          call generation:read \
            "$(jq -nc --argjson ctx "$editor_ctx" --argjson handle "$run_handle" '{args: [$handle, $ctx]}')" \
            "$work/generation-read.json"
          # An empty budgetDiagnostics is the defect this assertion exists for: the
          # view must carry the settled attempt, its receipt-backed diagnostics and
          # the committed candidate text, not a 200 with nothing in it.
          assert_json "$work/generation-read.json" '
            .result.status == "running"
            and .result.operation == $operation
            and (.result.budgetDiagnostics | length) == 1
            and (.result.budgetDiagnostics[0].attemptId | length) > 0
            and .result.inFlight == false
            and .result.nonReplayable == true
            and (.result.candidates | length) == 1
            and .result.candidates[0].text == $text
          ' --arg operation "$generation_operation" --arg text "$generation_text"

          call llm:list-models \
            "$(jq -nc '{args: []}')" \
            "$work/llm-list-models.json"
          assert_json "$work/llm-list-models.json" '
            (.result | length) == 2
            and ([.result[] | select(.id == $model and .hasCredential == true and .apiKey == "")] | length) == 1
            and ([.result[] | select(.id == $embedding)] | length) == 1
          ' --arg model "$model_id" --arg embedding "$embedding_model_id"
          # The stored credential must never leave the server, not even masked.
          if grep -qF 'synthetic-ci-model-key' "$work/llm-list-models.json"; then
            printf '::error title=llm:list-models leaked a credential::%s\n' "$(head -c 600 "$work/llm-list-models.json")"
            exit 1
          fi

          call llm:get-stage-models \
            "$(jq -nc '{args: []}')" \
            "$work/llm-stage-models.json"
          assert_json "$work/llm-stage-models.json" '.result.drafting == $model' --arg model "$model_id"

          call llm:get-default-model \
            "$(jq -nc '{args: []}')" \
            "$work/llm-default-model.json"
          assert_json "$work/llm-default-model.json" '.result == $model' --arg model "$model_id"

          call llm:get-default-embedding-model \
            "$(jq -nc '{args: []}')" \
            "$work/llm-default-embedding-model.json"
          assert_json "$work/llm-default-embedding-model.json" '.result == $model' --arg model "$embedding_model_id"

          # The generation reads are fenced like the editor reads: a lease this
          # server never issued is refused, not answered with history.
          expect_refusal generation:list \
            "$(jq -nc --argjson ctx "$stale_ctx" '{args: [$ctx]}')" \
            "$work/stale-generation-list.json"
          expect_refusal generation:read \
            "$(jq -nc --argjson ctx "$stale_ctx" --argjson handle "$run_handle" '{args: [$handle, $ctx]}')" \
            "$work/stale-generation-read.json"

          # What this lane does not own stays fail-closed: the execution half and
          # the three llm setters answer 501 GO_OPERATION_NOT_MIGRATED rather than
          # a handler that could only refuse.
          expect_not_migrated() {
            local operation=$1
            local body=$2
            local output=$3
            local code
            code=$(curl --silent --show-error --output "$output" --write-out '%{http_code}' \
              --request POST "$base/api/operations/$operation" \
              --header "X-Novel-User: $author" \
              --header "X-Client-Id: $client" \
              --header "X-CSRF-Token: $csrf" \
              --header "Origin: $base" \
              --header 'Content-Type: application/json' \
              --cookie "$session" \
              --data-binary "$body")
            printf '%s -> %s (not migrated)\n' "$operation" "$code" | tee -a "$work/refusals.txt"
            if test "$code" != 501; then
              printf '::error title=%s answered %s instead of 501::%s\n' "$operation" "$code" "$(head -c 600 "$output")"
              exit 1
            fi
            if ! jq -e '.error.code == "GO_OPERATION_NOT_MIGRATED"' "$output" > /dev/null; then
              printf '::error title=%s failed closed with another code::%s\n' "$operation" "$(head -c 600 "$output")"
              exit 1
            fi
          }
          for operation in generation:execute generation:cancel \
            llm:set-stage-model llm:set-default-model llm:set-default-embedding-model llm:save-model; do
            expect_not_migrated "$operation" \
              "$(jq -nc --argjson ctx "$editor_ctx" --argjson handle "$run_handle" \
                '{args: [$handle, "synthetic-model", $ctx]}')" \
              "$work/not-migrated-${operation//:/-}.json"
          done
          printf 'generation reads: 1 settled run (%s, epoch %s), 1 diagnostic, nonReplayable; models: %s + %s\n' \
            "$generation_operation" "$generation_epoch" "$model_id" "$embedding_model_id" \
            | tee -a "$work/statuses.txt"

          # The write is durable outside the process: the body is in the mounted
          # database on the host, not only in the container's memory.
          database="$root/workspaces/ci-novel/.ai-novel/project.db"
          # The root is owned by the container's uid and has no group/world
          # permission bits, so these reads run elevated, exactly like an
          # operator inspecting a deployment mount.
          sudo test -s "$database" || { printf '::error title=project database missing::%s\n' "$database"; exit 1; }
          if sudo grep -aqF -- "$saved" "$database" 2>/dev/null; then
            durable=project.db
          elif sudo grep -aqF -- "$saved" "$database-wal" 2>/dev/null; then
            durable=project.db-wal
          else
            printf '::error title=save was not durable::the saved body is not in the mounted project.db\n'
            exit 1
          fi
          printf 'durable write observed in the mounted %s\n' "$durable" | tee -a "$work/statuses.txt"
          # The journey image must still carry no Node at all.
          docker exec novel-go-journey-ci sh -c '! command -v node && ! command -v npm && ! command -v electron'
          docker logs novel-go-journey-ci 2>&1 | tail -20

          {
            printf '\n### Production draft journey inside the real container image\n\n'
            printf 'The unpublished image ran with `--read-only`, a disposable `NOVEL_DATA_ROOT=/data` owned by uid 65532, and no Node on `PATH`.\n\n'
            printf '```\n'
            cat "$work/statuses.txt"
            printf '```\n\n'
            printf -- '- `project:open` admitted project `%s` at `%s` and issued a lease.\n' "$project_id" "$project_path"
            printf -- '- `db:draft-list` returned the seeded draft with metadata only and no body.\n'
            printf -- '- `db:draft-update-content` committed by compare-and-swap and rotated the lease `%s` -> `%s`.\n' "$lease" "$fresh"
            printf -- '- `db:draft-get-full` returned the stored body and `wordCount` `%s`.\n\n' "$words"
            printf -- '- `db:character-get-all`, `db:character-roster-read`, `character-identity:read`, `db:project-core-get`, `db:blueprint-get-all`, `db:blueprint-get` and `project:overview-current` returned the seeded author rows (`%s`, `%s`, `%s`, plan `12`).\n' "$card" "$novel" "$chapter"
            printf -- '- The same reads refused a lease this server never issued: `%s` and `%s`.\n\n' \
              "$(jq -r '.error.code' "$work/stale-character-get-all.json")" \
              "$(jq -r '.error.code' "$work/stale-overview.json")"
            printf -- '- `generation:list` and `generation:read` returned the one settled run the fixture committed (`%s`, epoch `%s`) with 1 budget diagnostic and `nonReplayable` set, and `llm:list-models`, `llm:get-stage-models`, `llm:get-default-model` and `llm:get-default-embedding-model` returned the committed model configuration (`%s`, `%s`).\n' "$generation_operation" "$generation_epoch" "$model_id" "$embedding_model_id"
            printf -- '- Those generation reads refused a lease this server never issued (`%s`, `%s`), and `generation:execute`, `generation:cancel` and the three `llm:set-*` setters stayed `501 GO_OPERATION_NOT_MIGRATED`.\n\n' \
              "$(jq -r '.error.code' "$work/stale-generation-list.json")" \
              "$(jq -r '.error.code' "$work/stale-generation-read.json")"
            printf 'Body seeded into the v7 database: `%s`\n\n' "$seed"
            printf 'Body saved through the browser operation: `%s`\n\n' "$saved"
            printf 'Body read back from the container over HTTP: `%s`\n\n' "$readback"
            printf 'The same bytes are present in `%s` on the host, so the save survived the process.\n' "$durable"
          } >> "$GITHUB_STEP_SUMMARY"
      # The smoke-tested container is exported so it can be loaded and inspected
      # locally without registry credentials: pulling from GHCR needs the
      # read:packages scope, while a repository-scoped token may download
      # artifacts. Nothing is published or deployed here.
      - name: Export the smoke-tested container as an artifact
        shell: bash
        run: |
          set -euo pipefail
          docker save novel-go:migration-ci | gzip -1 > novel-go-image.tar.gz
          ls -lh novel-go-image.tar.gz
      - name: Upload the container artifact
        uses: actions/upload-artifact@v4
        with:
          name: novel-go-image
          path: novel-go-image.tar.gz
          retention-days: 7
          compression-level: 0
