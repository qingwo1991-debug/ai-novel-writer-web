name: Renderer lease regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderer-lease-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and save lease regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck renderer and desktop contracts
        run: pnpm run typecheck
      - name: Run project lease state regression
        run: pnpm exec vitest run src/stores/__tests__/project-committed-lease.test.ts
      - name: Install Chromium for browser regression
        run: pnpm exec playwright install --with-deps chromium
      - name: Run chapter save browser regression
        run: pnpm exec vitest run --config vitest.browser.config.ts src/components/stage/chapter/__tests__/chapter-safety.browser.tsx
