name: ai-novel-writer

services:
  ai-novel-writer:
    image: ai-novel-writer:1.4.0
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ai-novel-writer
    init: true
    ports:
      # nginx 8093/8445 统一鉴权；禁止局域网直连后端绕过密码。
      - "127.0.0.1:6080:6080"
    volumes:
      - /root/AI/ai-novel-writer-data:/data
    shm_size: 1gb
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "*", "-fsS", "http://127.0.0.1:6080/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
