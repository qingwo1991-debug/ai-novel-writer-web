# 书童浏览器入口：复用 DSH 的 Basic Auth 与本机证书。
# 后端 Docker 只发布 127.0.0.1:6080，不允许从局域网绕过认证。
map $http_upgrade $novel_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8093;
    listen 8445 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/ssl/dsh.crt;
    ssl_certificate_key /etc/nginx/ssl/dsh.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "AI Novel Writer";
    auth_basic_user_file /etc/nginx/.dsh_htpasswd;
    server_tokens off;
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:6080;
        proxy_http_version 1.1;
        # Preserve the external port: portal POST checks Origin against Host.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Login credentials belong to nginx, not the Electron/noVNC backend.
        proxy_set_header Authorization "";
        # The base image also supports unprotected LAN use. At this protected
        # entry, replace its warning so it accurately describes nginx auth.
        proxy_set_header Accept-Encoding "";
        sub_filter '无密码 · 仅限可信局域网' '已启用密码保护 · 共享桌面';
        sub_filter_once on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $novel_connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
