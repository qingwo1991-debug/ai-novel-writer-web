# Native browser entry; preserve existing DSH Basic Auth and local TLS files.
# The pure Node backend must publish ONLY 127.0.0.1:6081 on the host.
server {
    listen 8093;
    listen 8445 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/ssl/dsh.crt;
    ssl_certificate_key /etc/nginx/ssl/dsh.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "AI Novel Writer";
    auth_basic_user_file /etc/nginx/.dsh_htpasswd;
    server_tokens off;
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:6081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Header alone is not authentication. Always overwrite AFTER Basic Auth.
        proxy_set_header X-Novel-User $remote_user;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
